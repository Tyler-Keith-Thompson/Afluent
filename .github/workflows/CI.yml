name: CI

# The Bazel test suite, on every branch but main. PR_CI and Release call it too. Package.swift
# is checked against the Bazel graph by //:package_swift_test. Bazel does nearly all the work,
# since BuildBuddy caches it; one SwiftPM job runs the tests as the published package builds them.
on:
  push:
    branches:
      - '**'
      - '!main'
  workflow_dispatch:
  workflow_call:
    secrets:
      BUILDBUDDY_API_KEY:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  bazel:
    name: Bazel tests
    runs-on: ubuntu-26.04-arm
    # Swift with Bazel already in it (ci-image/ in the project template): rules_swift's Linux
    # toolchain is whatever swiftc is on the PATH, and Bazelisk runs the Bazel in .bazelversion.
    container:
      image: ghcr.io/tyler-keith-thompson/swift-bazel:6.3-9.3.1
      # The image is a private package that grants this repository access (Actions access in
      # the package's settings); the job's token pulls it.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Restore Bazel's downloads
        # The repository cache: rules, toolchains and packages Bazel fetched, by content hash.
        uses: actions/cache@v6
        with:
          path: ~/.cache/bazel-repository
          key: bazel-repository-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock', 'swift/Package.resolved') }}
          restore-keys: |
            bazel-repository-${{ runner.arch }}-
      - name: Configure the remote cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          # .bazelrc imports user.bazelrc when present. Without the key the build is uncached.
          echo "build --disk_cache=" > user.bazelrc
          echo "common --repository_cache=$HOME/.cache/bazel-repository" >> user.bazelrc
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            {
              echo "build --bes_results_url=https://app.buildbuddy.io/invocation/"
              echo "build --bes_backend=grpcs://remote.buildbuddy.io"
              echo "build --remote_cache=grpcs://remote.buildbuddy.io"
              echo "common --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY"
              echo "build --remote_cache_compression"
              echo "common --experimental_remote_cache_chunking"
            } >> user.bazelrc
          fi
      # Debug only: the release configuration's performance tests run locally before a push.
      - name: Test (debug)
        run: bazel test --keep_going //...

  # The one SwiftPM job: the published package, which Bazel doesn't build. Kept to the tests, since
  # nothing caches it beyond .build.
  swiftpm:
    name: SwiftPM tests
    runs-on: ubuntu-26.04-arm
    container: swift:6.3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .build
          key: swiftpm-${{ runner.arch }}-${{ hashFiles('Package.swift', 'swift/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.arch }}-
      - name: Test
        run: swift test
