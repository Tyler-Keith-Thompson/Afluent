name: Compatibility

# Afluent's check beyond CI's: a Bazel build for every Apple platform the package supports
# (//Platforms), cached through BuildBuddy like CI. Trunk's merge queue waits for it
# (.trunk/trunk.yaml), so it runs on its trunk-merge/ branches.
on:
  push:
    branches:
      - trunk-merge/**
  pull_request:
  workflow_dispatch:

jobs:
  apple-platforms:
    name: Apple platforms
    # macOS minutes cost the most: the merge queue's, not every pull request's.
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Restore Bazel and its downloads
        # The Bazel in .bazelversion, which the runner's Bazelisk downloads, and the repository
        # cache: rules, toolchains and packages Bazel fetched, by content hash.
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/bazelisk
            ~/.cache/bazel-repository
          key: bazel-macos-${{ runner.arch }}-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock', 'swift/Package.resolved') }}
          restore-keys: |
            bazel-macos-${{ runner.arch }}-
      - name: Configure the remote cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          # .bazelrc imports user.bazelrc when present. Without the key the build is uncached.
          echo "build --disk_cache=" > user.bazelrc
          echo "common --repository_cache=$HOME/.cache/bazel-repository" >> user.bazelrc
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            {
              echo "build --bes_results_url=https://app.buildbuddy.io/invocation/"
              echo "build --bes_backend=grpcs://remote.buildbuddy.io"
              echo "build --remote_cache=grpcs://remote.buildbuddy.io"
              echo "common --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY"
              echo "build --remote_cache_compression"
              echo "common --experimental_remote_cache_chunking"
            } >> user.bazelrc
          fi
      - name: Build for every Apple platform
        # The runner's Bazelisk runs the Bazel in .bazelversion.
        run: bazel test //Platforms
