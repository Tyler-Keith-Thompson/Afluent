name: DocC

# Builds one combined DocC site for every library module and publishes it to GitHub Pages
# (the gh-pages branch) at https://tyler-keith-thompson.github.io/Afluent/documentation/.
# Linux, not macOS: Linux runners cost less. Needs Pages set to deploy from gh-pages.
#
# The site is Bazel's //:docs (see tools/docc.bzl), built against the BuildBuddy remote cache, so
# a push rebuilds only the modules it changed and the modules that depend on them.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes a build still running, so minutes are not spent on stale docs.
concurrency:
  group: docc
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

jobs:
  docs:
    runs-on: ubuntu-26.04-arm
    # Swift with Bazel already in it (ci-image/ in the project template): rules_swift's Linux
    # toolchain is whatever swiftc is on the PATH, docc comes from beside it, and Bazelisk runs
    # the Bazel in .bazelversion.
    container:
      image: ghcr.io/tyler-keith-thompson/swift-bazel:6.4-9.3.1
      # The image is a private package that grants this repository access (Actions access in
      # the package's settings); the job's token pulls it.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Restore Bazel's downloads
        # The repository cache: rules, toolchains and packages Bazel fetched, by content hash.
        uses: actions/cache@v6
        with:
          path: ~/.cache/bazel-repository
          key: bazel-repository-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock', 'swift/Package.resolved') }}
          restore-keys: |
            bazel-repository-${{ runner.arch }}-
      - name: Configure the remote cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          # The runner is thrown away, so .bazelrc's local disk cache would only cost copying.
          echo "build --disk_cache=" > user.bazelrc
          echo "common --repository_cache=$HOME/.cache/bazel-repository" >> user.bazelrc
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            {
              echo "build --bes_results_url=https://app.buildbuddy.io/invocation/"
              echo "build --bes_backend=grpcs://remote.buildbuddy.io"
              echo "build --remote_cache=grpcs://remote.buildbuddy.io"
              echo "common --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY"
              echo "build --remote_cache_compression"
              echo "common --experimental_remote_cache_chunking"
            } >> user.bazelrc
          fi
      - name: Check Package.swift against the Bazel graph
        run: bazel test //:package_swift_test --test_output=errors
      - name: Generate the combined documentation
        run: |
          bazel build //:docs
          cp -RL bazel-bin/docs ./docs
          chmod -R u+w ./docs
      - name: Redirect the per-module addresses
        # Each module's documentation was once a site of its own, at /Afluent/<Module>/documentation/
        # <module>/. Every page of the combined site gets a page at its old address that redirects
        # to it, so links into those sites keep working.
        run: scripts/docs_redirects.sh docs Afluent AfluentTesting
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
