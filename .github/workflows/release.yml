name: Release

on:
  release:
    types: [ created ]

jobs:
  release-afluent:
    uses: ./.github/workflows/docc-release.yml
    with:
      target: ${{ 'Afluent' }}
    permissions:
      contents: write
  release-afluent-testing:
    needs: release-afluent # run serially
    uses: ./.github/workflows/docc-release.yml
    with:
      target: ${{ 'AfluentTesting' }}
    permissions:
      contents: write
 