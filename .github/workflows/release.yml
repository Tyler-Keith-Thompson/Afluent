name: Release

# Every push to main that passes CI is released: the patch version is bumped (or #minor / #major
# in the commit message), tagged, and published as a GitHub release.
on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/CI.yml
    secrets: inherit
    # The CI image is a private package this repository is granted access to; the token reads it.
    permissions:
      contents: read
      packages: read

  release:
    needs: ci
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Bump version and push tag
        id: bump_version
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          INITIAL_VERSION: 0.0.0
          RELEASE_BRANCHES: main
      # A major release (X.0.0) opens its notes with MIGRATING-X.0.md, the guide to what broke and
      # what to write instead; GitHub's generated list of pull requests follows it.
      - name: Pick the release notes
        id: notes
        env:
          TAG: ${{ steps.bump_version.outputs.new_tag }}
        run: |
          major="${TAG#v}"; major="${major%%.*}"
          if [[ "$TAG" =~ ^v?[0-9]+\.0\.0$ && -f "MIGRATING-$major.0.md" ]]; then
            echo "body_path=MIGRATING-$major.0.md" >> "$GITHUB_OUTPUT"
          fi
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.bump_version.outputs.new_tag }}
          name: Release ${{ steps.bump_version.outputs.new_tag }}
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: true
